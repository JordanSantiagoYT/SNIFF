[package]
name = "sniff-rust"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
arc = "0.0.1"
eframe = "0.31"
num-format = "0.4.4"
rayon = "1.12.0"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
dirs = "5"
simd-json = { version = "0.14", features = ["serde_impl"] }
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"
strip = true
